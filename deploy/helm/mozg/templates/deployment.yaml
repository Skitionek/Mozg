{{- $dbs := include "mozg.databases" . | fromYaml }}
{{- $sources := or (gt (len $dbs) 0) (gt (len .Values.mozg.extraSourcesConfigMaps) 0) }}
{{- $sqlite := false }}
{{- range $dbs }}{{ if eq .engine "sqlite3" }}{{ $sqlite = true }}{{ end }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mozg.fullname" . }}
  labels:
    {{- include "mozg.labels" . | nindent 4 }}
  annotations:
    {{- include "mozg.checkov.server" . | trim | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mozg.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- include "mozg.checkov.server" . | trim | nindent 8 }}
        # Restart when the catalog of self-hosted databases (or a SQLite
        # database's init SQL) changes.
        checksum/sources: {{ include (print $.Template.BasePath "/sources-configmap.yaml") . | sha256sum }}
        {{- if $sqlite }}
        checksum/sqlite: {{ include (print $.Template.BasePath "/db-init-configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "mozg.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mozg.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ add (div .Values.mozg.shutdownGraceMs 1000) 5 }}
      {{- if $sqlite }}
      # SQLite databases live in each Mozg pod: fetched, and given their init
      # SQL, before Mozg starts.
      initContainers:
        {{- range $name, $db := $dbs }}
        {{- $ctx := dict "root" $ "name" $name "db" $db }}
        {{- if eq $db.engine "sqlite3" }}
        {{- if and $db.dump $db.dump.url }}
        - name: fetch-{{ $name }}
          image: {{ $db.downloaderImage }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              {{- include "mozg.db.sqliteFetchScript" $ctx | nindent 14 }}
          env:
            - name: SQLITE_FILE
              value: {{ include "mozg.db.sqlitePath" $ctx | quote }}
            - name: DUMP_URL
              value: {{ $db.dump.url | quote }}
            - name: DUMP_SHA256
              value: {{ $db.dump.sha256 | default "" | quote }}
            - name: DUMP_FORMAT
              value: {{ $db.dump.format | default "sqlite" | quote }}
          resources:
            {{- toYaml $db.initResources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: sqlite-{{ $name }}
              mountPath: /var/lib/mozg/sqlite/{{ $name }}
        {{- end }}
        {{- if $db.initSQL }}
        # Mozg's own image carries the SQLite library it queries with.
        - name: init-{{ $name }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command:
            - node
            - -e
            - |
              const sqlite3 = require('sqlite3')
              const sql = require('node:fs').readFileSync('/mozg/init/init.sql', 'utf8')
              const db = new sqlite3.Database(process.env.SQLITE_FILE)
              db.exec(sql, (err) => {
                if (err) { console.error('mozg: init SQL failed: ' + err.message); process.exit(1) }
                db.close(() => console.log('mozg: ' + process.env.SQLITE_FILE + ' initialised'))
              })
          env:
            - name: SQLITE_FILE
              value: {{ include "mozg.db.sqlitePath" $ctx | quote }}
          resources:
            {{- toYaml $db.initResources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: sqlite-{{ $name }}
              mountPath: /var/lib/mozg/sqlite/{{ $name }}
            - name: sqlite-init-{{ $name }}
              mountPath: /mozg/init
              readOnly: true
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: mozg
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: PORT
              value: "4000"
            - name: NODE_ENV
              value: production
            - name: MOZG_HTTP_TIMEOUT_MS
              value: {{ .Values.mozg.httpTimeoutMs | quote }}
            - name: MOZG_HTTP_RETRIES
              value: {{ .Values.mozg.httpRetries | quote }}
            - name: MOZG_HTTP_CACHE_TTL_MS
              value: {{ .Values.mozg.httpCacheTtlMs | quote }}
            - name: MOZG_HTTP_CACHE_MAX_ENTRIES
              value: {{ .Values.mozg.httpCacheMaxEntries | quote }}
            - name: MOZG_RESULT_CACHE_TTL_MS
              value: {{ .Values.mozg.resultCache.ttlMs | quote }}
            {{- if .Values.mozg.resultCache.perSource }}
            - name: MOZG_RESULT_CACHE_TTL_BY_SOURCE
              value: {{ .Values.mozg.resultCache.perSource | toJson | quote }}
            {{- end }}
            - name: MOZG_RESULT_CACHE_MAX_ENTRIES
              value: {{ .Values.mozg.resultCache.maxEntries | quote }}
            - name: MOZG_RESULT_CACHE_MAX_BYTES
              value: {{ .Values.mozg.resultCache.maxBytes | int64 | quote }}
            - name: MOZG_CONNECTION_CACHE_MAX
              value: {{ .Values.mozg.connectionCacheMax | quote }}
            - name: MOZG_CONNECTION_IDLE_MS
              value: {{ .Values.mozg.connectionIdleMs | quote }}
            - name: MOZG_ONTOLOGY_CACHE_MAX
              value: {{ .Values.mozg.ontologyCacheMax | quote }}
            {{- if .Values.mozg.allowPrivateMirrors }}
            - name: MOZG_ALLOW_PRIVATE_MIRRORS
              value: "1"
            {{- end }}
            - name: MOZG_SHUTDOWN_GRACE_MS
              value: {{ .Values.mozg.shutdownGraceMs | quote }}
            - name: MOZG_WAKE_TIMEOUT_MS
              value: {{ .Values.mozg.wakeTimeoutMs | quote }}
            - name: MOZG_DEMAND_WINDOW_MS
              value: {{ .Values.mozg.demandWindowMs | quote }}
            # Every pod, so demand for a database is combined across replicas.
            - name: MOZG_PEERS
              value: "{{ include "mozg.peersName" . }}.{{ .Release.Namespace }}.svc.cluster.local"
            {{- if $sources }}
            - name: MOZG_SOURCES_DIR
              value: /etc/mozg/sources
            {{- end }}
            {{- range $name, $db := $dbs }}
            {{- $ctx := dict "root" $ "name" $name "db" $db }}
            {{- $prefix := include "mozg.db.envPrefix" $ctx }}
            # {{ $db.catalog.name }} ({{ $db.engine }}): connection held by the server, never sent to callers
            {{- if eq $db.engine "sqlite3" }}
            - name: {{ $prefix }}_DATABASE
              value: {{ include "mozg.db.sqlitePath" $ctx | quote }}
            {{- else }}
            {{- $host := printf "%s.%s.svc.cluster.local" (include "mozg.db.fullname" $ctx) $.Release.Namespace }}
            {{- if eq $db.engine "elasticsearch" }}
            - name: {{ $prefix }}_URL
              value: "http://{{ $host }}:{{ include "mozg.db.port" $ctx }}"
            {{- else }}
            - name: {{ $prefix }}_HOST
              value: {{ $host | quote }}
            - name: {{ $prefix }}_PORT
              value: {{ include "mozg.db.port" $ctx | quote }}
            - name: {{ $prefix }}_DATABASE
              value: {{ $db.database | quote }}
            {{- end }}
            - name: {{ $prefix }}_USER
              value: {{ $db.username | quote }}
            - name: {{ $prefix }}_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "mozg.db.secretName" $ctx }}
                  key: password
            {{- end }}
            {{- end }}
            {{- with .Values.mozg.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $sources }}
            - name: sources
              mountPath: /etc/mozg/sources
              readOnly: true
            {{- end }}
            {{- range $name, $db := $dbs }}
            {{- if eq $db.engine "sqlite3" }}
            - name: sqlite-{{ $name }}
              mountPath: /var/lib/mozg/sqlite/{{ $name }}
            {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- range $name, $db := $dbs }}
        {{- $ctx := dict "root" $ "name" $name "db" $db }}
        {{- if eq $db.engine "sqlite3" }}
        - name: sqlite-{{ $name }}
          emptyDir:
            sizeLimit: {{ $db.storage.size | default "1Gi" | quote }}
        {{- if $db.initSQL }}
        - name: sqlite-init-{{ $name }}
          configMap:
            name: {{ include "mozg.db.fullname" $ctx }}-init
        {{- end }}
        {{- end }}
        {{- end }}
        {{- if $sources }}
        - name: sources
          projected:
            sources:
              {{- if gt (len $dbs) 0 }}
              - configMap:
                  name: {{ include "mozg.fullname" . }}-sources
              {{- end }}
              {{- range .Values.mozg.extraSourcesConfigMaps }}
              - configMap:
                  name: {{ . }}
              {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
