{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "mozg.serviceAccountName" . }}
  labels:
    {{- include "mozg.labels" . | nindent 4 }}
  annotations:
    {{- include "mozg.checkov.resource" . | trim | nindent 4 }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
