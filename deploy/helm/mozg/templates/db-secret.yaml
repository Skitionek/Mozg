{{- $dbs := include "mozg.databases" . | fromYaml }}
{{- range $name, $db := $dbs }}
{{- $ctx := dict "root" $ "name" $name "db" $db }}
{{- if not $db.existingSecret }}
{{- $secretName := include "mozg.db.secretName" $ctx }}
{{- /* Keep the password stable across upgrades: the database only reads it on first start. */}}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $secretName }}
{{- $password := randAlphaNum 32 }}
{{- if and $existing $existing.data (hasKey $existing.data "password") }}
{{- $password = index $existing.data "password" | b64dec }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "mozg.db.labels" $ctx | nindent 4 }}
  annotations:
    {{- include "mozg.checkov.resource" $ | trim | nindent 4 }}
    # Survives uninstall, like the data volume it unlocks.
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
{{- end }}
{{- end }}
