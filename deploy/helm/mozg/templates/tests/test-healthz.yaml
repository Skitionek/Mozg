apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "mozg.fullname" . }}-test-healthz"
  labels:
    {{- include "mozg.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 100
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: healthz
      image: curlimages/curl:8.11.1
      command:
        - sh
        - -c
        - curl -fsS --retry 5 --retry-delay 2 --retry-all-errors http://{{ include "mozg.fullname" . }}:{{ .Values.service.port }}/healthz
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
