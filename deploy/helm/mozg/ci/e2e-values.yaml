# Values for the kind end-to-end test (.github/workflows/helm.yml).
# Two Mozg replicas exercise demand combined across pods; the example
# database scales to zero quickly so the test can watch a full cycle.
replicaCount: 2
image:
  repository: mozg
  tag: e2e
  pullPolicy: Never
podDisruptionBudget:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 128Mi
mozg:
  wakeTimeoutMs: 240000
  demandWindowMs: 15000
databases:
  example:
    enabled: true
    startupTimeoutSeconds: 300
    scaleToZero:
      enabled: true
      cooldownSeconds: 30
      pollingIntervalSeconds: 5
      initialCooldownSeconds: 0
