# Base values for the kind end-to-end test (.github/workflows/helm.yml), used
# with every ci/e2e-<engine>.yaml at once: one release hosts a database of
# each engine (databases.<engine>, registered as <engine>-proteins), each at
# the version of the CI preset under test.  Two Mozg replicas exercise demand
# combined across pods; the databases scale to zero quickly so the test can
# watch full cycles.
replicaCount: 2
image:
  repository: mozg
  tag: e2e
  pullPolicy: Never
podDisruptionBudget:
  enabled: false
resources:
  requests:
    cpu: 50m
    memory: 128Mi
mozg:
  wakeTimeoutMs: 240000
  demandWindowMs: 15000
databaseDefaults:
  startupTimeoutSeconds: 600
  storage:
    size: 1Gi
  scaleToZero:
    enabled: true
    cooldownSeconds: 30
    pollingIntervalSeconds: 5
    initialCooldownSeconds: 0
