databases:
  neo4j:
    enabled: true
    engine: neo4j
    database: e2e
    # Nodes labelled Protein are the connector's "proteins" entity.
    initCypher:
      - "CREATE (:Protein {id: 1, accession: 'P04637', note: 'tumour suppressor'})"
      - "CREATE (:Protein {id: 2, accession: 'P00533', note: 'EGFR'})"
    neo4j:
      heapSize: 512m
      pageCacheSize: 128m
    resources:
      requests:
        cpu: 200m
        memory: 768Mi
      limits:
        cpu: "2"
        memory: 1536Mi
    catalog:
      name: neo4j-proteins
      label: E2E proteins (neo4j)
      entities:
        - name: proteins
          description: Two proteins of interest
          columns: [id, accession, note]
          obo:
            accession: uniprot
          relations: []
