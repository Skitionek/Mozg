databases:
  postgres:
    enabled: true
    engine: postgres
    database: e2e
    initSQL: |
      CREATE TABLE proteins (id integer PRIMARY KEY, accession text NOT NULL, note text);
      INSERT INTO proteins VALUES (1, 'P04637', 'tumour suppressor'), (2, 'P00533', 'EGFR');
    catalog:
      name: postgres-proteins
      label: E2E proteins (postgres)
      entities:
        - name: proteins
          description: Two proteins of interest
          columns: [id, accession, note]
          obo:
            accession: uniprot
          relations: []
