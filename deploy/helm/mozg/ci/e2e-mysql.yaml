databases:
  mysql:
    enabled: true
    engine: mysql
    database: e2e
    initSQL: |
      CREATE TABLE proteins (id INT PRIMARY KEY, accession VARCHAR(16) NOT NULL, note TEXT);
      INSERT INTO proteins VALUES (1, 'P04637', 'tumour suppressor'), (2, 'P00533', 'EGFR');
    catalog:
      name: mysql-proteins
      label: E2E proteins (mysql)
      entities:
        - name: proteins
          description: Two proteins of interest
          columns: [id, accession, note]
          obo:
            accession: uniprot
          relations: []
