# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# `groups` below exist to keep tightly-coupled dependencies in a single PR.
# Packages in the same group pin each other via peer dependencies or are
# released in lockstep, so bumping one alone produces a broken build or a
# peer-dependency conflict.
# Add a package to an existing group rather than letting it be bumped solo.

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "ci"
    groups:
      # init/analyze/upload-sarif are three entrypoints of one action; they
      # must run at the same version across the workflows that call them.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
      # configure/upload-artifact/deploy form one Pages deployment handshake:
      # deploy-pages only accepts the artifact format the matching
      # upload-pages-artifact produces, so deploy-pages.yml breaks if these
      # drift apart.
      pages-actions:
        patterns:
          - "actions/configure-pages"
          - "actions/upload-pages-artifact"
          - "actions/deploy-pages"

  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build"
    groups:
      # The mesh handlers share @graphql-mesh/runtime and store internals and
      # are published together; a lone handler bump hits the runtime contract.
      graphql-mesh:
        patterns:
          - "@graphql-mesh/*"
      # graphql-yoga peers on the graphql major, and a duplicate graphql copy
      # in the tree breaks instanceof checks across the schema.
      graphql:
        patterns:
          - graphql
          - graphql-yoga
      # @eslint/js is versioned in step with the eslint major it ships for.
      eslint:
        patterns:
          - eslint
          - "@eslint/*"
