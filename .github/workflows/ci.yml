name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions: read-all

jobs:
  lint-and-test:
    name: Lint & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      matrix:
        node-version: ["22", "24", "26"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test with coverage (Node 26, the active LTS)
        if: ${{ matrix.node-version == '26' }}
        # src/catalog is excluded: its files describe external APIs, and their
        # field-mapping functions only run against real responses.  They are
        # covered by tests/catalog-relations.test.js (static lint, above) and
        # by the live verification in integration.yml, not by unit tests.
        run: |
          node --experimental-test-coverage \
               --test-coverage-exclude='src/catalog/**' \
               --test-coverage-lines=80 \
               --test-coverage-branches=90 \
               --test-coverage-functions=70 \
               --test tests/*.test.js

  docker:
    name: Docker image builds and serves /healthz
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t mozg:ci .

      # Native modules load only against a compatible C library; /healthz
      # never touches them.
      - name: SQLite works inside the image
        run: |
          docker run --rm --user 10001:10001 --read-only mozg:ci node -e "
            const sqlite3 = require('sqlite3')
            new sqlite3.Database(':memory:').get('select sqlite_version() as v', (err, row) => {
              if (err) throw err
              console.log('sqlite', row.v)
            })"

      - name: Start container and wait for /healthz
        run: |
          docker run -d --name mozg -p 4000:4000 mozg:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs mozg
          exit 1
