name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions: read-all

jobs:
  presets:
    name: Version presets
    uses: ./.github/workflows/presets.yml

  # One job per preset in .github/ci-presets.json (oldest supported, LTS,
  # newest pre-release), not one per version of everything.  The newest
  # preset is experimental: its failure is reported but does not fail CI.
  lint-and-test:
    name: Lint & Test (${{ matrix.preset.name }}, Node ${{ matrix.preset.node }})
    runs-on: ubuntu-latest
    needs: presets
    continue-on-error: ${{ matrix.preset.experimental }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.presets.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.preset.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.preset.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Test with coverage (LTS preset)
        if: ${{ matrix.preset.name == 'lts' }}
        # src/catalog is excluded: its files describe external APIs, and their
        # field-mapping functions only run against real responses.  They are
        # covered by tests/catalog-relations.test.js (static lint, above) and
        # by the live verification in integration.yml, not by unit tests.
        run: |
          node --experimental-test-coverage \
               --test-coverage-exclude='src/catalog/**' \
               --test-coverage-lines=80 \
               --test-coverage-branches=90 \
               --test-coverage-functions=70 \
               --test tests/*.test.js

  docker:
    name: Docker image (${{ matrix.preset.name }}, ${{ matrix.preset.nodeImage }})
    runs-on: ubuntu-latest
    needs: presets
    continue-on-error: ${{ matrix.preset.experimental }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.presets.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        env:
          NODE_IMAGE: ${{ matrix.preset.nodeImage }}
        run: docker build --build-arg NODE_IMAGE="$NODE_IMAGE" -t mozg:ci .

      # Native modules load only against a compatible C library; /healthz
      # never touches them.
      - name: SQLite works inside the image
        run: |
          docker run --rm --user 10001:10001 --read-only mozg:ci node -e "
            const sqlite3 = require('sqlite3')
            new sqlite3.Database(':memory:').get('select sqlite_version() as v', (err, row) => {
              if (err) throw err
              console.log('sqlite', row.v)
            })"

      - name: Start container and wait for /healthz
        run: |
          docker run -d --name mozg -p 4000:4000 mozg:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/healthz; then exit 0; fi
            sleep 1
          done
          docker logs mozg
          exit 1
