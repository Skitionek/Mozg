name: Integration Tests (Weekly)

# Runs weekly to validate that the catalog's public endpoints are still
# reachable.  Entries needing credentials are skipped; the rest are probed and
# classified as ok, broken (4xx — the catalog is wrong) or unavailable
# (5xx/network — their server is down).  Results are uploaded as an artifact so
# catalog staleness can be tracked over time.
#
# Also runs on manual trigger so maintainers can run it on demand.

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: read-all

jobs:
  catalog-health:
    name: Catalog endpoint health check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run catalog smoke tests
        # Each probed entry gets one list-or-entity request.  The script exits
        # non-zero only when an endpoint answers 4xx, which means the catalog
        # entry itself is wrong; third-party downtime never fails the job.
        run: node scripts/catalog-health.js --output catalog-health.json

      - name: Upload health report
        # The report is written before the step above can fail the job (a
        # broken catalog entry), so upload it on failure too — that is the
        # one case where this artifact is most worth having.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: catalog-health-${{ github.run_id }}
          path: catalog-health.json
          retention-days: 90
          if-no-files-found: warn

  bench:
    name: Latency benchmarks (local SQLite)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Seed sample database
        run: node examples/seed.js

      - name: Run latency benchmarks
        run: node --test tests/bench.test.js
