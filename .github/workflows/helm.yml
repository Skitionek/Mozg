name: Helm

# Validates the Helm chart and, on a real cluster (kind + KEDA) for every
# database engine, the whole self-hosted path: a database initialised on
# first start, scaled to zero when idle, woken by a Mozg query, joined to a
# public API by OBO key, scaled back to zero and woken again.

on:
  push:
    branches: ["**"]
    paths:
      - "deploy/**"
      - "src/**"
      - "Dockerfile"
      - "package*.json"
      - ".github/workflows/helm.yml"
  pull_request:
    paths:
      - "deploy/**"
      - "src/**"
      - "Dockerfile"
      - "package*.json"
      - ".github/workflows/helm.yml"
  workflow_dispatch:

permissions: read-all

env:
  CHART: deploy/helm/mozg
  HELM_VERSION: v3.19.0
  KUBECONFORM_VERSION: v0.7.0

jobs:
  chart:
    name: Lint, render and validate the chart
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Lint
        run: |
          helm lint --strict "$CHART"
          helm lint --strict "$CHART" \
            --set databases.chembl.enabled=true \
            --set databases.reactome.enabled=true \
            --set databases.example.enabled=true

      - name: Render and validate every configuration
        run: |
          set -euo pipefail
          all=(--set databases.chembl.enabled=true --set databases.reactome.enabled=true --set databases.example.enabled=true)
          validate() {
            kubeconform -strict -summary -kubernetes-version 1.30.0 \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
          }
          echo "defaults";                 helm template m "$CHART" | validate
          echo "all databases, KEDA";      helm template m "$CHART" "${all[@]}" --api-versions keda.sh/v1alpha1 | validate
          echo "all databases, no KEDA";   helm template m "$CHART" "${all[@]}" | validate
          echo "scale-to-zero off";        helm template m "$CHART" "${all[@]}" --api-versions keda.sh/v1alpha1 --set databaseDefaults.scaleToZero.enabled=false | validate
          echo "ingress, HPA, extra sources"
          helm template m "$CHART" --set ingress.enabled=true --set autoscaling.enabled=true --set 'mozg.extraSourcesConfigMaps[0]=my-sources' | validate
          for engine in postgres mysql neo4j arango elasticsearch sqlite3; do
            echo "e2e values, $engine"
            helm template m "$CHART" -f "$CHART/ci/e2e-values.yaml" -f "$CHART/ci/e2e-$engine.yaml" --api-versions keda.sh/v1alpha1 | validate
          done

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Lint the self-hosted catalog entries with Mozg's catalog lint
        # OBO keys, oboForm, relations and their targets: the same checks
        # every built-in source passes.
        run: |
          set -euo pipefail
          npm ci
          render_sources() {
            rm -rf rendered-sources && mkdir -p rendered-sources
            helm template m "$CHART" "$@" --show-only templates/sources-configmap.yaml > sources.yaml
            for key in $(yq -r '.data | keys | .[]' sources.yaml); do
              yq -r ".data[\"$key\"]" sources.yaml > "rendered-sources/$key"
            done
            node "$CHART/ci/lint-sources.js" rendered-sources
          }
          render_sources --set databases.chembl.enabled=true --set databases.reactome.enabled=true --set databases.example.enabled=true
          for engine in postgres mysql neo4j arango elasticsearch sqlite3; do
            render_sources -f "$CHART/ci/e2e-values.yaml" -f "$CHART/ci/e2e-$engine.yaml"
          done

      - name: Invalid values are rejected
        run: |
          set -uo pipefail
          expect_failure() {
            if helm template m "$CHART" "$@" >/dev/null 2>err.txt; then
              echo "::error::accepted invalid values: $*"; exit 1
            fi
            echo "rejected ($*): $(head -n 2 err.txt | tr '\n' ' ')"
          }
          expect_failure --set databases.chembl.enabled=true --set databases.chembl.engine=oracle
          expect_failure --set databases.example.enabled=true --set databases.example.dump.sha256=nothex
          expect_failure --set databases.reactome.enabled=true --set databases.reactome.username=admin
          expect_failure --set databases.My_DB.enabled=true
          expect_failure --set databases.example.enabled=true --set databases.example.engine=arango --set databases.example.username=admin
          expect_failure --set databases.example.enabled=true --set databases.example.engine=mysql --set databases.example.username=root
          expect_failure --set databases.example.enabled=true --set databases.example.engine=sqlite3 --set databases.example.initSQL=

  e2e:
    name: Scale to zero on kind (${{ matrix.engine }})
    runs-on: ubuntu-latest
    needs: chart
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [postgres, mysql, neo4j, arango, elasticsearch, sqlite3]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: mozg

      - name: Install KEDA
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update
          helm install keda kedacore/keda --namespace keda --create-namespace --wait --timeout 5m

      - name: Build the Mozg image and load it into kind
        run: |
          docker build -t mozg:e2e .
          kind load docker-image mozg:e2e --name mozg

      - name: Install the chart with a self-hosted ${{ matrix.engine }} database
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          helm install mozg "$CHART" --namespace bio --create-namespace \
            -f "$CHART/ci/e2e-values.yaml" -f "$CHART/ci/e2e-$ENGINE.yaml" --wait --timeout 10m
          helm test mozg --namespace bio --timeout 2m
          kubectl -n bio get all

      - name: Scale to zero, wake on query, join by OBO key, scale back, wake again
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          kubectl -n bio port-forward svc/mozg 4000:80 >/tmp/port-forward.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://localhost:4000/healthz >/dev/null 2>&1 && break; sleep 1; done
          "$CHART/ci/e2e.sh"

      - name: Diagnostics
        if: failure()
        run: |
          set +e
          kubectl -n bio get all,scaledobject,hpa,pvc -o wide
          kubectl -n bio describe scaledobject
          kubectl -n bio describe statefulset mozg-db-e2e
          kubectl -n bio logs deploy/mozg --all-containers --tail=200
          kubectl -n bio logs statefulset/mozg-db-e2e --all-containers --tail=300
          kubectl -n keda logs deploy/keda-operator --tail=200
          kubectl -n bio get events --sort-by=.lastTimestamp | tail -50
