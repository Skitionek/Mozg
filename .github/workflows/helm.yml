name: Helm

# Validates the Helm chart and, on a real cluster (kind + KEDA) holding a
# database of every engine, the whole self-hosted path: a database
# initialised on first start, scaled to zero when idle, woken by a Mozg
# query, joined to a public API by OBO key, scaled back to zero and woken
# again.
#
# Once per preset in .github/ci-presets.json (oldest supported, LTS, newest
# pre-release): Kubernetes, kind, Helm, KEDA, Node and every database image
# move together.  The newest preset is experimental: its failure does not
# fail CI.

on:
  push:
    branches: ["**"]
    paths:
      - "deploy/**"
      - "src/**"
      - "Dockerfile"
      - "package*.json"
      - ".github/workflows/helm.yml"
      - ".github/workflows/presets.yml"
      - ".github/ci-presets.json"
  pull_request:
    paths:
      - "deploy/**"
      - "src/**"
      - "Dockerfile"
      - "package*.json"
      - ".github/workflows/helm.yml"
      - ".github/workflows/presets.yml"
      - ".github/ci-presets.json"
  workflow_dispatch:

permissions: read-all

env:
  CHART: deploy/helm/mozg
  KUBECONFORM_VERSION: v0.8.0
  # One database of each engine; ci/e2e-<engine>.yaml defines it.
  ENGINES: postgres mysql neo4j arango elasticsearch sqlite3

jobs:
  presets:
    name: Version presets
    uses: ./.github/workflows/presets.yml

  chart:
    name: Lint, render and validate the chart (${{ matrix.preset.name }}, Helm ${{ matrix.preset.helm }}, Kubernetes ${{ matrix.preset.kubernetes }})
    runs-on: ubuntu-latest
    needs: presets
    continue-on-error: ${{ matrix.preset.experimental }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.presets.outputs.matrix) }}
    env:
      KUBERNETES_VERSION: ${{ matrix.preset.kubernetes }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm ${{ matrix.preset.helm }}
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.preset.helm }}

      - name: Install kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz -C /usr/local/bin kubeconform

      - name: Lint
        run: |
          helm lint --strict "$CHART"
          helm lint --strict "$CHART" \
            --set databases.chembl.enabled=true \
            --set databases.reactome.enabled=true \
            --set databases.example.enabled=true

      - name: Render and validate every configuration
        run: |
          set -euo pipefail
          all=(--set databases.chembl.enabled=true --set databases.reactome.enabled=true --set databases.example.enabled=true)
          read -r -a engine_list <<<"$ENGINES"
          # kubeconform's schemas are published per minor: v1.35.8 -> 1.35.0.
          k8s=${KUBERNETES_VERSION#v}
          k8s=${k8s%.*}.0
          validate() {
            kubeconform -strict -summary -kubernetes-version "$k8s" \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -
          }
          echo "defaults";                 helm template m "$CHART" | validate
          echo "all databases, KEDA";      helm template m "$CHART" "${all[@]}" --api-versions keda.sh/v1alpha1 | validate
          echo "all databases, no KEDA";   helm template m "$CHART" "${all[@]}" | validate
          echo "scale-to-zero off";        helm template m "$CHART" "${all[@]}" --api-versions keda.sh/v1alpha1 --set databaseDefaults.scaleToZero.enabled=false | validate
          echo "ingress, HPA, extra sources"
          helm template m "$CHART" --set ingress.enabled=true --set autoscaling.enabled=true --set 'mozg.extraSourcesConfigMaps[0]=my-sources' | validate
          every=(-f "$CHART/ci/e2e-values.yaml")
          for engine in "${engine_list[@]}"; do
            echo "e2e values, $engine"
            helm template m "$CHART" -f "$CHART/ci/e2e-values.yaml" -f "$CHART/ci/e2e-$engine.yaml" --api-versions keda.sh/v1alpha1 | validate
            every+=(-f "$CHART/ci/e2e-$engine.yaml")
          done
          echo "e2e values, every engine"
          helm template m "$CHART" "${every[@]}" --api-versions keda.sh/v1alpha1 | validate

      - name: Set up Node.js ${{ matrix.preset.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.preset.node }}
          cache: "npm"

      - name: Lint the self-hosted catalog entries with Mozg's catalog lint
        # OBO keys, oboForm, relations and their targets: the same checks
        # every built-in source passes.
        run: |
          set -euo pipefail
          npm ci
          render_sources() {
            rm -rf rendered-sources && mkdir -p rendered-sources
            helm template m "$CHART" "$@" --show-only templates/sources-configmap.yaml > sources.yaml
            for key in $(yq -r '.data | keys | .[]' sources.yaml); do
              yq -r ".data[\"$key\"]" sources.yaml > "rendered-sources/$key"
            done
            node "$CHART/ci/lint-sources.js" rendered-sources
          }
          render_sources --set databases.chembl.enabled=true --set databases.reactome.enabled=true --set databases.example.enabled=true
          read -r -a engine_list <<<"$ENGINES"
          every=(-f "$CHART/ci/e2e-values.yaml")
          for engine in "${engine_list[@]}"; do every+=(-f "$CHART/ci/e2e-$engine.yaml"); done
          render_sources "${every[@]}"

      - name: Invalid values are rejected
        run: |
          set -uo pipefail
          expect_failure() {
            if helm template m "$CHART" "$@" >/dev/null 2>err.txt; then
              echo "::error::accepted invalid values: $*"; exit 1
            fi
            echo "rejected ($*): $(head -n 2 err.txt | tr '\n' ' ')"
          }
          expect_failure --set databases.chembl.enabled=true --set databases.chembl.engine=oracle
          expect_failure --set databases.example.enabled=true --set databases.example.dump.sha256=nothex
          expect_failure --set databases.reactome.enabled=true --set databases.reactome.username=admin
          expect_failure --set databases.My_DB.enabled=true
          expect_failure --set databases.example.enabled=true --set databases.example.engine=arango --set databases.example.username=admin
          expect_failure --set databases.example.enabled=true --set databases.example.engine=mysql --set databases.example.username=root
          expect_failure --set databases.example.enabled=true --set databases.example.engine=sqlite3 --set databases.example.initSQL=

  e2e:
    name: Scale to zero on kind (${{ matrix.preset.name }}, Kubernetes ${{ matrix.preset.kubernetes }})
    runs-on: ubuntu-latest
    needs: [presets, chart]
    timeout-minutes: 45
    continue-on-error: ${{ matrix.preset.experimental }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJSON(needs.presets.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm ${{ matrix.preset.helm }}
        uses: azure/setup-helm@v5
        with:
          version: ${{ matrix.preset.helm }}

      - name: Create kind ${{ matrix.preset.kind }} cluster (Kubernetes ${{ matrix.preset.kubernetes }})
        uses: helm/kind-action@v1
        with:
          cluster_name: mozg
          version: ${{ matrix.preset.kind }}
          node_image: kindest/node:${{ matrix.preset.kubernetes }}
          kubectl_version: ${{ matrix.preset.kubernetes }}

      - name: Install KEDA ${{ matrix.preset.keda }}
        env:
          KEDA_VERSION: ${{ matrix.preset.keda }}
        run: |
          helm repo add kedacore https://kedacore.github.io/charts
          helm repo update
          helm install keda kedacore/keda --version "$KEDA_VERSION" \
            --namespace keda --create-namespace --wait --timeout 5m

      - name: Build the Mozg image on node:${{ matrix.preset.nodeImageTag }} and load it into kind
        env:
          NODE_TAG: ${{ matrix.preset.nodeImageTag }}
        run: |
          docker build --build-arg NODE_TAG="$NODE_TAG" -t mozg:e2e .
          kind load docker-image mozg:e2e --name mozg

      - name: Install the chart with a self-hosted database of every engine
        env:
          POSTGRES: ${{ matrix.preset.postgres }}
          MARIADB: ${{ matrix.preset.mariadb }}
          NEO4J: ${{ matrix.preset.neo4j }}
          ARANGODB: ${{ matrix.preset.arangodb }}
          ELASTICSEARCH: ${{ matrix.preset.elasticsearch }}
        run: |
          set -euo pipefail
          read -r -a engine_list <<<"$ENGINES"
          values=(-f "$CHART/ci/e2e-values.yaml")
          for engine in "${engine_list[@]}"; do values+=(-f "$CHART/ci/e2e-$engine.yaml"); done
          # The chart's mysql engine runs MariaDB.
          helm install mozg "$CHART" --namespace bio --create-namespace "${values[@]}" \
            --set-string databases.postgres.image.tag="$POSTGRES" \
            --set-string databases.mysql.image.tag="$MARIADB" \
            --set-string databases.neo4j.image.tag="$NEO4J" \
            --set-string databases.arango.image.tag="$ARANGODB" \
            --set-string databases.elasticsearch.image.tag="$ELASTICSEARCH" \
            --wait --timeout 20m
          helm test mozg --namespace bio --timeout 2m
          kubectl -n bio get all
          kubectl -n bio get statefulsets -o custom-columns='NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image'

      - name: Every engine scales to zero, wakes on a query, joins by OBO key, scales back and wakes again
        run: |
          set -uo pipefail
          # Kept up for the whole test: a port-forward dies with the pod it picked.
          (while true; do kubectl -n bio port-forward svc/mozg 4000:80 >>/tmp/port-forward.log 2>&1; sleep 1; done) &
          for _ in $(seq 1 30); do curl -fsS http://localhost:4000/healthz >/dev/null 2>&1 && break; sleep 1; done
          read -r -a engine_list <<<"$ENGINES"
          mkdir -p e2e-logs
          pids=()
          for engine in "${engine_list[@]}"; do
            ENGINE=$engine "$CHART/ci/e2e.sh" >"e2e-logs/$engine.log" 2>&1 &
            pids+=("$!")
          done
          failed=()
          for i in "${!engine_list[@]}"; do
            if wait "${pids[$i]}"; then result=passed; else result=failed; failed+=("${engine_list[$i]}"); fi
            echo "::group::${engine_list[$i]}: $result"
            cat "e2e-logs/${engine_list[$i]}.log"
            echo "::endgroup::"
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::end-to-end check failed for: ${failed[*]}"
            exit 1
          fi

      - name: Diagnostics
        if: failure()
        run: |
          set +e
          kubectl -n bio get all,scaledobject,hpa,pvc -o wide
          kubectl -n bio describe scaledobject
          kubectl -n bio logs deploy/mozg --all-containers --tail=300
          read -r -a engine_list <<<"$ENGINES"
          for engine in "${engine_list[@]}"; do
            [ "$engine" = sqlite3 ] && continue
            echo "::group::$engine"
            kubectl -n bio describe statefulset "mozg-db-$engine"
            kubectl -n bio logs "statefulset/mozg-db-$engine" --all-containers --tail=200
            echo "::endgroup::"
          done
          kubectl -n keda logs deploy/keda-operator --tail=200
          kubectl -n bio get events --sort-by=.lastTimestamp | tail -80
