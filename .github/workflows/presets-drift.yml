name: Presets drift

# Checks the CI version presets (.github/ci-presets.json) against
# endoflife.date every week: the oldest preset must be the oldest release
# line still supported, the lts preset the current LTS (or newest) line, and
# the newest preset no older than the newest line.  A failed run means a
# preset needs moving; the report says which and to what.

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/ci-presets.json"
      - "scripts/ci-presets.js"
      - ".github/workflows/presets-drift.yml"

permissions: read-all

jobs:
  drift:
    name: Presets against endoflife.date
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Check the presets
        run: node scripts/ci-presets.js
