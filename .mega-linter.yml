# MegaLinter configuration — https://megalinter.io/latest/configuration/

# Disable linters that produce only false positives on this codebase
DISABLE_LINTERS:
  - COPYPASTE_JSCPD # similar patterns in database driver and test files are intentional
  - REPOSITORY_DEVSKIM # false positives: http ontology URIs, setTimeout, TODO markers, localhost defaults, md5 column name

# Make non-blocking (findings still uploaded as SARIF for review):
REPOSITORY_GITLEAKS_DISABLE_ERRORS: true # rnacentral.js uses public read-only EBI credentials; paper/mozg.tex is example LaTeX code
SPELL_CSPELL_DISABLE_ERRORS: true # spelling findings are advisory; false positives expected for domain-specific terms
SPELL_LYCHEE_DISABLE_ERRORS: true # megalinter.io URL may 404 on older version paths; links are correct
SPELL_MISSPELL_DISABLE_ERRORS: true # spelling findings are advisory
SPELL_PROSELINT_DISABLE_ERRORS: true # prose style findings are advisory
REPOSITORY_TRIVY_DISABLE_ERRORS: true # MEDIUM CVE in fast-xml-parser tracked in a dedicated issue
LATEX_CHKTEX_DISABLE_ERRORS: true # paper/mozg.tex uses intentional LaTeX formatting (aligned table spacing, code-listing quotes)
REPOSITORY_GRYPE_DISABLE_ERRORS: true # those are handled by dependabot

# Exclude JSONC files (which support comments) from strict JSON linting
JSON_JSONLINT_FILTER_REGEX_EXCLUDE: "(devcontainer\\.json|\\.vscode/)"

# Keep kingfisher off the files that deliberately carry credential-shaped
# strings. kingfisher reports one finding per run, so these were enumerated
# from the tree rather than one red CI round at a time:
#   - .secretlintrc.json is secretlint's own allows list, whose entries exist
#     so secretlint ignores the fixtures below.
#   - tests/errors.test.js and tests/stream.test.js assert that
#     redactCredentials strips passwords out of driver error messages, so they
#     must contain realistic URIs to be worth anything.
#   - src/catalog/rnacentral.js and paper/mozg.tex carry RNAcentral's public
#     read-only password, which cannot be reworded without breaking the
#     catalog; REPOSITORY_GITLEAKS_DISABLE_ERRORS above names the same two.
# Scoped to these paths so kingfisher still fails the build on a secret
# anywhere else, and the MongoDB URI rule stays enabled.
REPOSITORY_KINGFISHER_ARGUMENTS:
  - --exclude
  - .secretlintrc.json
  - --exclude
  - tests/errors.test.js
  - --exclude
  - tests/stream.test.js
  - --exclude
  - src/catalog/rnacentral.js
  - --exclude
  - paper/mozg.tex
